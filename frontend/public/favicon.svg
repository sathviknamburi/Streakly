<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Outer fiery blaze gradient -->
    <linearGradient id="streakOuter" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="25%" stop-color="#FF381E"/>
      <stop offset="70%" stop-color="#E51515"/>
      <stop offset="100%" stop-color="#C20815"/>
    </linearGradient>

    <!-- Mid flame gradient: rich burning amber to orange -->
    <linearGradient id="streakMid" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFCA28"/>
      <stop offset="40%" stop-color="#FFA000"/>
      <stop offset="85%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#E64A19"/>
    </linearGradient>

    <!-- Core flame gradient: glowing hot radiant center -->
    <linearGradient id="streakCore" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFF59D"/>
      <stop offset="80%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Soft ambient flame drop shadow -->
    <filter id="flameGlow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FF381E" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Flame Body -->
  <path filter="url(#flameGlow)" fill="url(#streakOuter)" d="M32 2.5C32.6 2.5 36.2 11.8 43.2 18.2C49.8 24.2 54.5 32.8 54.5 42C54.5 53.6 44.4 62 32 62C19.6 62 9.5 53.6 9.5 42C9.5 31.4 15 22.8 20.2 16.2C21.6 14.4 22.6 12.6 22.8 10.6C23 8.6 22.2 7 20.8 5C25.4 7 28.5 11.2 29 15.2C29.4 17.8 28.5 20.4 26.8 22.5C29.4 19 31.5 10.5 32 2.5Z"/>

  <!-- Mid Flame Body -->
  <path fill="url(#streakMid)" d="M33 15C33.5 15 36.8 21.6 42.4 26.8C47 31 48.8 36.6 48.8 42.8C48.8 51.5 41.3 57.5 32 57.5C22.7 57.5 15.2 51.5 15.2 42.8C15.2 34.6 19.8 27.5 24 22.4C25.4 20.6 26.2 18.8 26.2 16.8C28.8 19.4 30.4 23 29.8 25.6C31.4 22 32.5 17.8 33 15Z"/>

  <!-- Inner Core / Ember -->
  <path fill="url(#streakCore)" d="M32 30.5C32.5 30.5 35.2 34.6 38.2 38.2C40.6 41.2 41.2 44.8 41.2 47.8C41.2 52.8 37.1 55.5 32 55.5C26.9 55.5 22.8 52.8 22.8 47.8C22.8 43.2 25.8 39.2 28.8 35.6C29.8 34.1 30.4 32.6 30.4 31C31.1 32.4 31.7 33.7 31.4 35.2C31.7 33.5 31.9 31.6 32 30.5Z"/>

  <!-- Streak Spark Accents -->
  <circle cx="47.5" cy="13.5" r="2.2" fill="#FFCA28" opacity="0.95"/>
  <circle cx="15.5" cy="10.5" r="1.5" fill="#FFA000" opacity="0.8"/>
  <circle cx="39" cy="6" r="1.2" fill="#FFF59D" opacity="0.85"/>
</svg>